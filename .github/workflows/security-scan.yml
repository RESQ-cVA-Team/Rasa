name: Security Scan

on:
  pull_request:
  push:
    branches:
      - master
      - dev
  schedule:
    - cron: "19 4 * * 1"
  workflow_dispatch:

jobs:
  trivy-fs:
    name: Trivy Filesystem Scan (manifest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Trivy scan - blocking, fixable HIGH/CRITICAL
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Trivy scan - report, all MEDIUM+ including unfixed
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          format: table
          exit-code: "0"

  trivy-image:
    name: Trivy Image Scan (as shipped)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build image (local load only, not pushed)
        run: |
          set -euo pipefail
          # One representative language build (en/US) is enough here: every
          # language variant shares the same base image and Python
          # dependency footprint, which is what a vulnerability scan looks
          # at -- only the trained NLU data differs per language.
          docker buildx build \
            --build-arg LAYERS="src/core src/locales/en/US" \
            --load \
            -t rasa-security-scan:local \
            .

      - name: Trivy scan - blocking, fixable HIGH/CRITICAL
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: rasa-security-scan:local
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: "1"

      - name: Trivy scan - report, all MEDIUM+ including unfixed
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: rasa-security-scan:local
          scanners: vuln
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          format: table
          exit-code: "0"

  python-dependencies:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          audit_output="$(mktemp)"
          audit_status=0

          python -m pip_audit -r requirements.txt --format=json --aliases=off --desc=off --output "$audit_output" || audit_status=$?

          if [[ ! -s "$audit_output" ]]; then
          echo "pip-audit did not produce JSON output" >&2
          exit "${audit_status:-1}"
          fi

          python - "$audit_output" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text())
          actionable = []
          unfixed = []

          for dependency in payload.get("dependencies", []):
            name = dependency.get("name", "<unknown>")
            version = dependency.get("version", "<unknown>")
            for vulnerability in dependency.get("vulns", []):
              fix_versions = vulnerability.get("fix_versions") or []
              entry = {
                "name": name,
                "version": version,
                "id": vulnerability.get("id", "<unknown>"),
                "fix_versions": fix_versions,
              }
              (actionable if fix_versions else unfixed).append(entry)

          # Report every vulnerability found -- including ones with no fix
          # yet -- so they stay visible instead of being silently dropped.
          # Only the fixable ones (below) fail the build.
          if unfixed:
            print("Python vulnerabilities with no known fix yet (report only, does not fail the build):")
            for vulnerability in unfixed:
              print(f"- {vulnerability['name']} {vulnerability['version']}: {vulnerability['id']}")
            print()

          if not actionable:
            print("No Python vulnerabilities with known fixes found.")
            sys.exit(0)

          print("Python vulnerabilities with known fixes:")
          for vulnerability in actionable:
            fixes = ", ".join(vulnerability["fix_versions"])
            print(
              f"- {vulnerability['name']} {vulnerability['version']}: "
              f"{vulnerability['id']} -> {fixes}"
            )

          sys.exit(1)
          PY