action_endpoint:
  url: ${ACTION_ENDPOINT_URL}
  timeout: 300
lock_store:
  type: redis
  url: ${LOCK_STORE_URL}
  db: ${LOCK_STORE_DB}
  password: ${REDIS_PASSWORD}
tracker_store:
  type: redis
  url: ${TRACKER_STORE_URL}
  db: ${TRACKER_STORE_DB}
  password: ${REDIS_PASSWORD}
cors:
  enabled: false
  allowed_origins: []