version: "3.1"
recipe: default.v1
language: en
assistant_id: 20250610-194333-refined-siberian
pipeline:
  # Tokenization
  - name: WhitespaceTokenizer

  # Featurization
  - name: RegexFeaturizer
  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4

  # EXPERIMENTAL: LLM-only intent classification + entity extraction, replacing
  # DIETClassifier + RegexEntityExtractor. See src/components/llm_nlu_classifier.py.
  # Tokenizer/featurizers above are kept (ResponseSelector below still needs
  # them); everything downstream of this (EntitySynonymMapper,
  # SSOTCanonicalizer, EntityConsolidator, FallbackClassifier,
  # LLMIntentFallback) is unmodified -- this produces the same message.data
  # shape those two components would have.
  - name: src.components.llm_nlu_classifier.LLMNluClassifier
    debug_logging: false

  # Entity Extraction with roles and groups support
  #- name: CRFEntityExtractor
  #  # BILOU_flag determines whether to use BILOU tagging or not.
  #  BILOU_flag: true
  #  # features to extract in the sliding window
  #  features: [
  #    ["low", "title", "upper"],
  #    [
  #      "bias",
  #      "low",
  #      "prefix5",
  #      "prefix2",
  #      "suffix5",
  #      "suffix3",
  #      "suffix2",
  #      "upper",
  #      "title",
  #      "digit",
  #      "pattern",
  #      "text_dense_features"
  #    ],
  #    ["low", "title", "upper"],
  #  ]
  #  max_iterations: 50
  #  L1_c: 0.1
  #  L2_c: 0.1

  # Post-processing
  - name: EntitySynonymMapper
    # Only apply synonyms to these entities, skip numeric entities with roles
    entities:
      [
        "metric",
        "sex",
        "stroke_type",
        "chart_type",
        "group_by",
        "boolean_type",
        "country_code",
      ]

  # Canonicalize SSOT-backed entity values (e.g. metric -> DTN)
  - name: src.components.ssot_canonicalizer.SSOTCanonicalizer
    # Enforce canonical values for entities that can break downstream actions when noisy.
    strict_entities: ["metric", "chart_type", "group_by"]
  - name: ResponseSelector
    epochs: 100
    constrain_similarities: true

  # CLI intent override (configure prefixes/intent here)
  - name: src.components.cli_intent_setter.CLIIntentSetter
    prefixes: ["/cli", "!"]
    intent_name: "cli_command"

  # Optional: Uncomment if you need time/date entities
  #- name: DucklingEntityExtractor
  #  url: http://duckling:8000
  #  dimensions: ["time"]

  # Entity consolidation -- kept last so it runs after CLIIntentSetter/
  # ResponseSelector/SSOTCanonicalizer, on the final entity set. Previously
  # registered twice (once configured, once bare "keep this LAST"); the bare
  # second pass silently re-ran consolidation under Rasa's defaults
  # (position_tolerance 0, confidence_strategy "highest"), discarding the
  # confidence_entity_all/confidence_role_all data the configured pass built.
  - name: src.components.entity_consolidator.EntityConsolidator
    # Position matching strategy: "exact", "overlap", "ignore"
    position_matching: "exact"

    # For exact matching: tolerance in characters for start/end positions
    position_tolerance: 2

    # For overlap matching: minimum overlap ratio (0.0 to 1.0)
    overlap_threshold: 0.7

    # Which aspects to use for consolidation key
    consolidation_key: ["entity", "start", "end", "role", "value"]
    # Alternative examples:
    # consolidation_key: ["entity", "value", "role"]  # Ignore positions
    # consolidation_key: ["entity", "value"]          # Ignore positions and roles

    # Whether to preserve role information
    role_aware: true

    # Whether to normalize values (lowercase, trim) before comparison
    value_normalization: false

    # Whether to keep all extractor information
    preserve_all_extractors: true

    # Confidence strategy: "highest", "average", "all"
    confidence_strategy: "all"

    # Debug logging for troubleshooting
    debug_logging: false

    # Collect consolidation statistics
    collect_stats: false

  # Fallback handling
  - name: FallbackClassifier
    threshold: 0.3
    ambiguity_threshold: 0.1

  # LLM fallback -- only runs when FallbackClassifier just fired above (i.e.
  # Rasa's own classifier already gave up), not on every message. Asks an LLM
  # to pick one of the real domain intents; anything that isn't an exact
  # match to that closed set is discarded and the nlu_fallback prediction
  # from FallbackClassifier stands. No-ops entirely if LLM_PROVIDER/LLM_MODEL
  # aren't configured.
  - name: src.components.llm_intent_fallback.LLMIntentFallback
    enabled: true
    llm_confidence: 0.5
    max_tokens: 20
    timeout_seconds: 8
    debug_logging: false
policies:
  - name: MemoizationPolicy
  - name: RulePolicy
    enable_fallback_prediction: false
    core_fallback_threshold: 0.3
    core_fallback_action_name: "action_default_fallback"
  - name: UnexpecTEDIntentPolicy
    max_history: 5
    epochs: 100
  - name: TEDPolicy
    max_history: 5
    epochs: 100
    constrain_similarities: true
importers:
  - name: "src.components.layered_importer.OverlayImporter"
    base_domain: ["src/core/domain"]
    overlay_domain: []
    #src_root: "src" # used to expand OVERLAYS tokens like "locale/en-US"
  - name: "RasaFileImporter"
