version: "3.1"

rules:
  - rule: Who are you? What can you do?
    steps:
      - intent: who_are_you
      - action: utter_who_are_you
      - action: utter_user_prompt
  - rule: How can I visualize my data?
    steps:
      - intent: help_me
      - action: utter_help_user
      - action: utter_user_prompt
  - rule: Expanded help section and FAQ
    steps:
      - intent: faq_help
      - action: utter_faq_help
  - rule: Take me back to user prompt
    steps:
      - intent: return_to_user_prompt
      - action: utter_user_prompt
