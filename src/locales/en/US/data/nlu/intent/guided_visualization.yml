version: "3.1"

nlu:
  - intent: request_guided_visualization
    examples: |
      - help me build a graph
      - guide me through creating a graph
      - walk me through a visualization
      - help me make a chart
      - can you guide me step by step
      - show me a guided visualization
      - i need guided help with a graph
      - i want to do a guided visualization
      - i require a step by step visualization

  - intent: request_freeform_visualization
    examples: |
      - I'll describe it myself
      - let me type the request
      - I want to do it freeform
      - I'll just say what I want
      - I'll do it in one message
      - skip the guided steps, let me just ask
      - I'll write out the whole request myself
      - let me specify everything at once
      - I don't need the step-by-step, I'll just describe it
      - I'd rather just type my own request
      - I'll handle it in a single message
      - let me just tell you what I want directly

  - intent: cancel_guided_visualization
    examples: |
      - switch to freeform mode
      - switch to one-shot mode
      - exit guided mode
      - stop guided mode
      - cancel the guided flow
      - cancel guided mode
      - end guided mode
      - stop
      - cancel
      - halt
      - exit

  - intent: provide_guided_hospital_scope
    examples: |
      - use [US](country_code)
      - [United States](country_code)
      - [ES](country_code)
      - [Spain](country_code)
      - [Mexico](country_code)
      - use hospital [Memorial](hospital_name)
      - [General](hospital_name)
      - hospital group [10](group_id)
      - group [25](group_id)
      - [all hospitals](hospital_scope_reference)
      - [all](hospital_scope_reference)
      - [my hospital](hospital_scope_reference)
      - [mine](hospital_scope_reference)
      - [ours](hospital_scope_reference)
      - [our hospital](hospital_scope_reference)
      - [Canada](country_code)
      - use [Germany](country_code)
      - [Japan](country_code)
      - hospital named [Saint](hospital_name)
      - use [Children](hospital_name)
      - [just mine](hospital_scope_reference)
      - [the whole network](hospital_scope_reference)
      - use group [50](group_id)
      - [everything](hospital_scope_reference)
      - just my hospital
      - only my hospital
      - the whole country
      - [all hospitals in my country](hospital_scope_reference)
      - hospital [Saint Mary](hospital_name)
      - use [Sweden](country_code)
      - [UK](country_code)
      - [United Kingdom](country_code)
      - group number [42](group_id)
      - [France](country_code)
      - use [Italy](country_code)
      - hospital [Central](hospital_name)
      - [everywhere](hospital_scope_reference)
      - [across all sites](hospital_scope_reference)
      - just this one hospital

