    examples: |
      - skip
      - skip this
      - next
      - continue
      - move on
      - no
      - no thanks
      - not now
      - maybe later
      - nope
      - nah
      - no filter
      - none
      - leave it blank
      - don't care
      - whatever works
      - I don't have a preference
      - any is fine
      - doesn't matter
      - pass
      - not applicable
      - let's move to the next one
