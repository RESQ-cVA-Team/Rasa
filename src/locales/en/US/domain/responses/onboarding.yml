version: "3.1"
responses:
  utter_user_prompt:
    - text: "How can I help you?"
      buttons:
        - title: Who are you?
          payload: /who_are_you
        - title: How do I visualize my data?
          payload: /help_me
        - title: Show me the expanded help section
          payload: /faq_help
        - title: Guide me through a visualization
          payload: /request_guided_visualization
        - title: I want to describe my graph in one message
          payload: /request_freeform_visualization

  utter_who_are_you:
    - text: >-
        I am a bot that can help you visualize RES-Q data. 
        I can guide you step by step to build a graph, or you 
        can describe the graph you want in one message and I'll
        try to build it for you.
  utter_help_user:
    - text: |-
        I can help you visualize your RES-Q data.
        Guided Visualizations: You can always ask 'guide me' to have me guide you through creating a graph step by step. 
        Freeform Visualizations: If you know exactly what you want, you can always describe the graph in one message and I'll try to build it for you.
        Here are some examples of what you can ask me to do:
        - Make a line chart of percentage of ischemic strokes per quarter 
        - Show a graph with dtn per quarter for ischemic patients grouped by sex
        - Compare my dtn per quarter with [hospital/country] using a line chart
        - Can you compare my dtn for Q4 2025 and Q1 2026 using a mann whitney u test 
        - Make me an admission nihss of only patients older than 60 years
  utter_faq_help:
    - text: |-
        Here is a list components and variables you can use to structure your visualizations.
        You can also always ask me to define a Metric by asking "What is [metric name]?" or "What does [metric name] mean?"
      buttons:
        - title: Metric types
          payload: /faq_metric_types
        - title: Stroke types
          payload: /faq_stroke_types
        - title: Chart types
          payload: /faq_chart_types
        - title: Group-by types
          payload: /faq_group_by_types
        - title: Statistical test types
          payload: /faq_statistical_test_types
        - title: Sex Types
          payload: /faq_sex_types
        - title: Boolean types
          payload: /faq_boolean_types
        - title: Operator types
          payload: /faq_operator_types
        - title: SSOT
          payload: /faq_ssot_help
        - title: Go back
          payload: /return_to_user_prompt
  utter_faq_again:
    - text: |-
        Anything else you want to know?
      buttons:
        - title: Metric types
          payload: /faq_metric_types
        - title: Stroke types
          payload: /faq_stroke_types
        - title: Chart types
          payload: /faq_chart_types
        - title: Group-by types
          payload: /faq_group_by_types
        - title: Statistical test types
          payload: /faq_statistical_test_types
        - title: Sex Types
          payload: /faq_sex_types
        - title: Boolean types
          payload: /faq_boolean_types
        - title: Operator types
          payload: /faq_operator_types
        - title: SSOT
          payload: /faq_ssot_help
        - title: Go back
          payload: /return_to_user_prompt
