version: "3.1"

nlu:
  - intent: who_are_you
    examples: |
      - Πώς χρησιμοποιώ αυτό το bot;
      - Ποιος είσαι;
      - Τι είναι αυτό;
      - Τι μπορείς να κάνεις;
      - Ποιος είναι ο σκοπός σου;
      - Γιατί υπάρχεις;
      - Τι μπορώ να σε ρωτήσω;
      - Σε τι χρησιμεύει αυτό το bot;
      - Ποια είναι η λειτουργία σου;
      - Ποιος είναι ο ρόλος σου;
      - Τι κάνεις;
      - Ποια είναι η δουλειά σου;
  - intent: faq_help
    examples: |
      - Εμφάνισε την αναλυτική ενότητα βοήθειας
      - Εμφάνισε την αναλυτική βοήθεια
  - intent: return_to_user_prompt
    examples: |
      - Πίσω
      - Πίσω στο κύριο μενού
      - Γύρνα με πίσω
      - Επιστροφή στην αρχή
